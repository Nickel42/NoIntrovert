# Checks once a week whether the ES-DE system list built into the app
# (NoIntrovert/Core/Esde/es_systems.json) is from ES-DE's latest release,
# and opens an issue when it isn't (docs/requirements/cleanup-wizard.md, FR-6a).
# The app updates its own copy at run time; this keeps the shipped snapshot current.

name: ES-DE snapshot

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare the snapshot with ES-DE's latest release
        id: compare
        run: |
          set -euo pipefail
          api="https://gitlab.com/api/v4/projects/es-de%2Femulationstation-de"
          latest=$(curl -fsS "$api/releases?per_page=1" | jq -r '.[0].tag_name')
          path="resources/systems/unix/es_systems.xml"
          commit=$(curl -fsS "$api/repository/commits?path=${path//\//%2F}&ref_name=$latest&per_page=1" | jq -r '.[0].id')
          bundled=$(jq -r '.ref' NoIntrovert/Core/Esde/es_systems.json)
          bundled_commit=$(jq -r '.commit' NoIntrovert/Core/Esde/es_systems.json)
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "bundled=$bundled" >> "$GITHUB_OUTPUT"
          if [ "$commit" != "$bundled_commit" ]; then echo "behind=true" >> "$GITHUB_OUTPUT"; else echo "behind=false" >> "$GITHUB_OUTPUT"; fi
          echo "Bundled $bundled ($bundled_commit); ES-DE $latest ($commit)"

      - name: Open an issue when the snapshot is behind
        if: steps.compare.outputs.behind == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.compare.outputs.latest }}
          COMMIT: ${{ steps.compare.outputs.commit }}
          BUNDLED: ${{ steps.compare.outputs.bundled }}
        run: |
          set -euo pipefail
          title="Update the bundled ES-DE system list to $LATEST"
          if gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[].number' | grep -q .; then
            echo "An issue is already open: $title"
            exit 0
          fi
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$(cat <<EOF
          The ES-DE system list built into the app (\`NoIntrovert/Core/Esde/es_systems.json\`) is from **$BUNDLED**; ES-DE's latest release is **$LATEST**, where \`resources/systems/unix/es_systems.xml\` last changed in commit \`$COMMIT\`.

          Regenerate the snapshot from https://gitlab.com/es-de/emulationstation-de/-/raw/$LATEST/resources/systems/unix/es_systems.xml (name, full name, extensions in lower case), set \`ref\` and \`commit\`, and check the registry's \`esde\` names (the self-test *the bundled snapshot … has every folder the registry maps to*).

          Opened by the weekly *ES-DE snapshot* workflow.
          EOF
          )"
