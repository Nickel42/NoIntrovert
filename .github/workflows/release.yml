# Builds lib-chd-kit, lib-wii-gamecube-kit, lib-7z-zip-kit and NoIntrovert for Windows x64, Windows ARM64, macOS
# (Apple silicon and Intel) and Linux x64, and publishes them as a GitHub
# release when a v* tag is pushed. Run it by hand (Actions → Release → Run
# workflow) to get the same downloads as workflow artifacts without making a
# release.
#
# Everything is built from source: lib-chd-kit (native/lib-chd-kit) from this
# repository, and lib-wii-gamecube-kit, lib-7z-zip-kit (the archive engine) and
# lib-wii-u-kit (Wii U to .wua, managed code only) from their own repositories,
# git submodules in native/lib-wii-gamecube-kit, native/lib-7z-zip-kit and
# native/lib-wii-u-kit. Private ones need a checkout token that can read
# them: the LIB_REPOS_TOKEN secret (a fine-grained token with read access to
# their contents).

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: version
    runs-on: windows-2022
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
          submodules: true
          token: ${{ secrets.LIB_REPOS_TOKEN || github.token }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build lib-chd-kit (x64) and run its tests
        shell: pwsh
        run: |
          cmake -S app/native/lib-chd-kit -B app/native/lib-chd-kit/build-x64 -G "Visual Studio 17 2022" -A x64
          cmake --build app/native/lib-chd-kit/build-x64 --config Release --parallel
          ctest --test-dir app/native/lib-chd-kit/build-x64 -C Release --output-on-failure

      - name: Build lib-chd-kit (ARM64)
        shell: pwsh
        # Cross-compiled on the x64 runner, so its tests can't run here.
        # MSVC rejects the brace-initialised NEON vectors in FLAC's
        # lpc_intrin_neon.c (C2078), so FLAC uses its portable C code on this
        # target. CFLAGS only seeds the first configure, adding to CMake's defaults.
        env:
          CFLAGS: /DFLAC__NO_ASM
        run: |
          cmake -S app/native/lib-chd-kit -B app/native/lib-chd-kit/build-arm64 -G "Visual Studio 17 2022" -A ARM64 `
            -DCHDMAN_BUILD_TESTS=OFF -DCHDMAN_BUILD_STATIC=OFF -DCHDMAN_BUILD_CLI=OFF
          cmake --build app/native/lib-chd-kit/build-arm64 --config Release --parallel --target chdman_shared

      - name: Stage native libraries
        shell: pwsh
        run: |
          foreach ($arch in 'x64', 'arm64') {
            $dir = "app/native/lib-chd-kit/artifacts/native/win-$arch"
            New-Item -ItemType Directory -Force $dir | Out-Null
            Copy-Item "app/native/lib-chd-kit/build-$arch/Release/chdkit.dll" $dir
          }

      - name: Fetch 7-Zip and bit7z sources for lib-7z-zip-kit
        shell: bash
        run: bash app/native/lib-7z-zip-kit/scripts/fetch-sources.sh

      - name: Build lib-7z-zip-kit (x64 and ARM64)
        shell: cmd
        # Into its own artifacts\native\win-<arch>, from the sources in its _deps.
        run: |
          call app\native\lib-7z-zip-kit\scripts\build-win.cmd x64 || exit /b 1
          call app\native\lib-7z-zip-kit\scripts\build-win.cmd arm64 || exit /b 1

      - name: Build lib-wii-gamecube-kit (x64 with its tests, and ARM64)
        shell: cmd
        # Into its own artifacts\native\win-<arch>. The ARM64 build is
        # cross-compiled, so its tests only run on x64.
        run: |
          call app\native\lib-wii-gamecube-kit\scripts\build-win.cmd x64 || exit /b 1
          call app\native\lib-wii-gamecube-kit\scripts\build-win.cmd arm64 || exit /b 1

      - name: Publish and zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($rid in 'win-x64', 'win-arm64') {
            $out = "publish/$rid"
            dotnet publish app/NoIntrovert/NoIntrovert.csproj -c Release -r $rid --self-contained `
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
              -p:DebugType=none -p:Version=$env:VERSION `
              -o $out
            if (-not (Test-Path "$out/NoIntrovert.exe")) { throw "publish for $rid produced no NoIntrovert.exe" }
            foreach ($lib in '7z.dll', 'sevenzipkit.dll', 'lib-wii-gamecube-kit.dll') {
              if (-not (Test-Path "$out/$lib")) { throw "publish for $rid is missing $lib" }
            }
            Copy-Item app/README.md, app/LICENSE, app/packaging/THIRD_PARTY_ARCHIVES.md, app/native/lib-chd-kit/THIRD_PARTY_NOTICES.md $out
            Copy-Item app/native/lib-chd-kit/LICENSE "$out/LICENSE-lib-chd-kit.txt"
            Copy-Item app/native/lib-wii-gamecube-kit/LICENSE "$out/LICENSE-lib-wii-gamecube-kit.txt"
            Copy-Item app/native/lib-wii-gamecube-kit/THIRD_PARTY_NOTICES.md "$out/THIRD_PARTY_NOTICES-lib-wii-gamecube-kit.md"
            Copy-Item app/native/lib-wii-gamecube-kit/vendor/BUNDLED_LICENSES.txt "$out/LICENSES-lib-wii-gamecube-kit-bundled.txt"
            Copy-Item app/native/lib-7z-zip-kit/LICENSE "$out/LICENSE-lib-7z-zip-kit.txt"
            Copy-Item app/native/lib-wii-u-kit/LICENSE "$out/LICENSE-lib-wii-u-kit.txt"
            Copy-Item app/NoIntrovert/Core/Emulators/Data/THIRD_PARTY_NOTICES.txt "$out/THIRD_PARTY_NOTICES-emulator-data.txt"
            Copy-Item app/native/lib-7z-zip-kit/_deps/7zip-src/DOC/License.txt "$out/LICENSE-7-Zip.txt"
            Copy-Item app/native/lib-7z-zip-kit/_deps/bit7z-src/LICENSE "$out/LICENSE-bit7z.txt"
            Compress-Archive -Path "$out/*" -DestinationPath "dist/NoIntrovert-$env:VERSION-$rid.zip" -Force
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip
          if-no-files-found: error

  macos:
    needs: version
    runs-on: macos-15
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
          submodules: true
          token: ${{ secrets.LIB_REPOS_TOKEN || github.token }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Use the newest Xcode
        # Dolphin's code (lib-wii-gamecube-kit) needs AppleClang 21 or newer.
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          clang --version

      - name: Build lib-chd-kit (universal) and run its tests
        run: |
          cmake -S app/native/lib-chd-kit -B app/native/lib-chd-kit/build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
          cmake --build app/native/lib-chd-kit/build --parallel
          ctest --test-dir app/native/lib-chd-kit/build --output-on-failure
          mkdir -p app/native/lib-chd-kit/artifacts/native/osx
          cp -L app/native/lib-chd-kit/build/libchdkit.dylib app/native/lib-chd-kit/artifacts/native/osx/libchdkit.dylib
          lipo -info app/native/lib-chd-kit/artifacts/native/osx/libchdkit.dylib

      - name: Build lib-7z-zip-kit (universal)
        run: |
          bash app/native/lib-7z-zip-kit/scripts/fetch-sources.sh
          bash app/native/lib-7z-zip-kit/scripts/build-mac.sh

      - name: Build lib-wii-gamecube-kit (universal) and run its tests
        run: bash app/native/lib-wii-gamecube-kit/scripts/build-mac.sh

      - name: Publish, bundle and zip
        run: |
          mkdir -p dist
          cp app/native/lib-chd-kit/LICENSE LICENSE-lib-chd-kit.txt
          cp app/native/lib-wii-gamecube-kit/LICENSE LICENSE-lib-wii-gamecube-kit.txt
          cp app/native/lib-wii-gamecube-kit/THIRD_PARTY_NOTICES.md THIRD_PARTY_NOTICES-lib-wii-gamecube-kit.md
          cp app/native/lib-wii-gamecube-kit/vendor/BUNDLED_LICENSES.txt LICENSES-lib-wii-gamecube-kit-bundled.txt
          cp app/native/lib-7z-zip-kit/LICENSE LICENSE-lib-7z-zip-kit.txt
          cp app/native/lib-wii-u-kit/LICENSE LICENSE-lib-wii-u-kit.txt
          cp app/NoIntrovert/Core/Emulators/Data/THIRD_PARTY_NOTICES.txt THIRD_PARTY_NOTICES-emulator-data.txt
          cp app/native/lib-7z-zip-kit/_deps/7zip-src/DOC/License.txt LICENSE-7-Zip.txt
          cp app/native/lib-7z-zip-kit/_deps/bit7z-src/LICENSE LICENSE-bit7z.txt
          for rid in osx-arm64 osx-x64; do
            # Single-file packs the managed DLLs into the executable, so Contents/MacOS holds
            # only Mach-O files, whose signatures live inside them and survive any unzip tool.
            dotnet publish app/NoIntrovert/NoIntrovert.csproj -c Release -r "$rid" --self-contained \
              -p:UseAppHost=true -p:PublishSingleFile=true -p:DebugType=none -p:Version="$VERSION" \
              -o "publish/$rid"
            for lib in libchdkit.dylib 7z.so libsevenzipkit.dylib lib-wii-gamecube-kit.dylib; do
              test -f "publish/$rid/$lib" || { echo "$lib missing from $rid publish"; exit 1; }
            done
            bash app/packaging/macos/make-app.sh "publish/$rid" "$GITHUB_WORKSPACE/dist/NoIntrovert-$VERSION-$rid.zip" "$VERSION" \
              app/README.md app/LICENSE LICENSE-lib-chd-kit.txt app/native/lib-chd-kit/THIRD_PARTY_NOTICES.md \
              LICENSE-lib-7z-zip-kit.txt LICENSE-7-Zip.txt LICENSE-bit7z.txt app/packaging/THIRD_PARTY_ARCHIVES.md \
              LICENSE-lib-wii-gamecube-kit.txt THIRD_PARTY_NOTICES-lib-wii-gamecube-kit.md LICENSES-lib-wii-gamecube-kit-bundled.txt \
              LICENSE-lib-wii-u-kit.txt THIRD_PARTY_NOTICES-emulator-data.txt
          done

      - name: Check the Apple silicon zip unpacks to a validly signed app
        run: |
          unzip -q "dist/NoIntrovert-$VERSION-osx-arm64.zip" -d smoke
          # The app has no command-line mode; checking the bundle's binaries is the most CI can do without a display.
          file smoke/NoIntrovert.app/Contents/MacOS/*
          codesign --verify --deep --strict --verbose=2 smoke/NoIntrovert.app
          # The app icon: Finder and the Dock read CFBundleIconFile from Contents/Resources.
          plutil -lint smoke/NoIntrovert.app/Contents/Info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' smoke/NoIntrovert.app/Contents/Info.plist)" = "NoIntrovert"
          file smoke/NoIntrovert.app/Contents/Resources/NoIntrovert.icns | grep -q 'Mac OS X icon'

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.zip
          if-no-files-found: error

  linux:
    needs: version
    # The oldest supported Ubuntu LTS image: the native libraries need this
    # glibc (2.35) or newer, so building on it keeps the download portable.
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
          submodules: true
          token: ${{ secrets.LIB_REPOS_TOKEN || github.token }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build lib-chd-kit and run its tests
        run: |
          cmake -S app/native/lib-chd-kit -B app/native/lib-chd-kit/build -DCMAKE_BUILD_TYPE=Release
          cmake --build app/native/lib-chd-kit/build --parallel "$(nproc)"
          ctest --test-dir app/native/lib-chd-kit/build --output-on-failure
          mkdir -p app/native/lib-chd-kit/artifacts/native/linux-x64
          cp -L app/native/lib-chd-kit/build/libchdkit.so app/native/lib-chd-kit/artifacts/native/linux-x64/libchdkit.so

      - name: Build lib-7z-zip-kit
        run: |
          bash app/native/lib-7z-zip-kit/scripts/fetch-sources.sh
          bash app/native/lib-7z-zip-kit/scripts/build-linux.sh

      - name: Build lib-wii-gamecube-kit and run its tests
        # Dolphin's code needs GCC 12+; Ubuntu 22.04's default is 11. libstdc++ is
        # linked statically, so the .so still only needs glibc 2.35.
        env:
          CC: gcc-12
          CXX: g++-12
        run: bash app/native/lib-wii-gamecube-kit/scripts/build-linux.sh

      - name: Check the native libraries' exports and dependencies
        run: |
          check() { # library, prefix of the only symbols it may export
            local extra
            extra="$(nm -D --defined-only "$1" | awk '{print $3}' | grep -v "^$2" || true)"
            if [ -n "$extra" ]; then echo "$1 exports more than $2*:"; echo "$extra" | head -20; exit 1; fi
            echo "$1: $(nm -D --defined-only "$1" | wc -l) exports, all $2*"
            if ldd "$1" | grep 'not found'; then exit 1; fi
            echo "  needs glibc $(objdump -T "$1" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)," \
              "libstdc++ $(objdump -T "$1" | grep -o 'GLIBCXX_[0-9.]*' | sort -uV | tail -1)"
          }
          check app/native/lib-chd-kit/artifacts/native/linux-x64/libchdkit.so chdman_
          check app/native/lib-7z-zip-kit/artifacts/native/linux-x64/libsevenzipkit.so szk_
          check app/native/lib-wii-gamecube-kit/artifacts/native/linux-x64/lib-wii-gamecube-kit.so wii_gamecube_kit_
          ldd app/native/lib-7z-zip-kit/artifacts/native/linux-x64/7z.so

      - name: Self-test (quick, synthetic discs)
        # test-roms isn't available here, so the tests generate stand-in discs.
        run: |
          dotnet run --project app/NoIntrovert.Tests/NoIntrovert.Tests.csproj -c Release \
            -- --quick --synthetic

      # The .wua writer and reader (lib-wii-u-kit, through the app) against Exzap's reference implementation, both ways.
      - uses: actions/checkout@v4
        with:
          repository: Exzap/ZArchive
          ref: d2c717730092c7bf8cbb033b12fd4001b7c4d932 # v0.1.2
          path: zarchive

      - name: Check .wua files against Exzap's zarchive tool
        run: |
          sudo apt-get install -y -q libzstd-dev
          cmake -S zarchive -B zarchive/build -DCMAKE_BUILD_TYPE=Release
          cmake --build zarchive/build --parallel --target zarchiveTool
          tool=zarchive/build/zarchive
          tests="dotnet run --project app/NoIntrovert.Tests/NoIntrovert.Tests.csproj -c Release --no-build --"
          # 1. The reference tool unpacks NoIntrovert's .wua to exactly the titles that went in.
          $tests --wua-sample wua-check
          "$tool" wua-check/sample.wua wua-check/by-zarchive
          diff -r wua-check/expected wua-check/by-zarchive
          # 2. NoIntrovert's reader verifies and unpacks an archive the reference tool wrote.
          "$tool" wua-check/expected wua-check/by-zarchive.zar
          $tests --unpack-zar wua-check/by-zarchive.zar wua-check/by-noi
          diff -r wua-check/expected wua-check/by-noi
          echo "Both directions match."

      - name: Publish and tar
        run: |
          rid=linux-x64
          name="NoIntrovert-$VERSION-$rid"
          out="publish/$name"
          dotnet publish app/NoIntrovert/NoIntrovert.csproj -c Release -r "$rid" --self-contained \
            -p:PublishSingleFile=true -p:DebugType=none -p:Version="$VERSION" \
            -o "$out"
          for f in NoIntrovert libchdkit.so 7z.so libsevenzipkit.so lib-wii-gamecube-kit.so; do
            test -f "$out/$f" || { echo "$f missing from the $rid publish"; exit 1; }
          done
          test -x "$out/NoIntrovert"
          cp app/README.md app/LICENSE app/packaging/THIRD_PARTY_ARCHIVES.md app/native/lib-chd-kit/THIRD_PARTY_NOTICES.md "$out/"
          cp app/native/lib-chd-kit/LICENSE "$out/LICENSE-lib-chd-kit.txt"
          cp app/native/lib-wii-gamecube-kit/LICENSE "$out/LICENSE-lib-wii-gamecube-kit.txt"
          cp app/native/lib-wii-gamecube-kit/THIRD_PARTY_NOTICES.md "$out/THIRD_PARTY_NOTICES-lib-wii-gamecube-kit.md"
          cp app/native/lib-wii-gamecube-kit/vendor/BUNDLED_LICENSES.txt "$out/LICENSES-lib-wii-gamecube-kit-bundled.txt"
          cp app/native/lib-7z-zip-kit/LICENSE "$out/LICENSE-lib-7z-zip-kit.txt"
          cp app/native/lib-wii-u-kit/LICENSE "$out/LICENSE-lib-wii-u-kit.txt"
          cp app/NoIntrovert/Core/Emulators/Data/THIRD_PARTY_NOTICES.txt "$out/THIRD_PARTY_NOTICES-emulator-data.txt"
          cp app/native/lib-7z-zip-kit/_deps/7zip-src/DOC/License.txt "$out/LICENSE-7-Zip.txt"
          cp app/native/lib-7z-zip-kit/_deps/bit7z-src/LICENSE "$out/LICENSE-bit7z.txt"
          # App icon in the freedesktop hicolor layout, plus a menu entry and its installer.
          for size in 16 32 48 64 128 256 512; do
            mkdir -p "$out/icons/hicolor/${size}x${size}/apps"
            cp "app/packaging/icon/png/nointrovert-$size.png" "$out/icons/hicolor/${size}x${size}/apps/nointrovert.png"
          done
          cp app/packaging/linux/nointrovert.desktop app/packaging/linux/install-desktop-entry.sh "$out/"
          chmod +x "$out/install-desktop-entry.sh"
          ls -l "$out"
          mkdir -p dist
          tar -C publish -czf "dist/$name.tar.gz" "$name"

      - name: Smoke test the app under a virtual display
        # The app has no command-line mode: start it on Xvfb, check it is still
        # running after a while, and keep a screenshot of its window.
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q xvfb x11-apps x11-utils imagemagick desktop-file-utils
          mkdir smoke && tar -xzf "dist/NoIntrovert-$VERSION-linux-x64.tar.gz" -C smoke
          pkg="smoke/NoIntrovert-$VERSION-linux-x64"

          # The menu entry is valid, and the installer puts it and the icons in place.
          desktop-file-validate "$pkg/nointrovert.desktop"
          HOME="$PWD/smoke/home" XDG_DATA_HOME= "$pkg/install-desktop-entry.sh"
          desktop-file-validate smoke/home/.local/share/applications/nointrovert.desktop
          grep -q "^Exec=\"$PWD/$pkg/NoIntrovert\" %F" smoke/home/.local/share/applications/nointrovert.desktop
          for size in 16 32 48 64 128 256 512; do
            file "smoke/home/.local/share/icons/hicolor/${size}x${size}/apps/nointrovert.png" | grep -q "${size} x ${size}"
          done
          Xvfb :99 -screen 0 1280x800x24 & xvfb=$!
          export DISPLAY=:99
          sleep 2
          "smoke/NoIntrovert-$VERSION-linux-x64/NoIntrovert" > smoke/app.log 2>&1 & app=$!
          sleep 20
          if ! kill -0 "$app" 2>/dev/null; then echo "The app exited:"; cat smoke/app.log; exit 1; fi
          # The window carries the app icon (what taskbars and Alt-Tab show on X11).
          win=$(xwininfo -root -tree | grep -m1 'NoIntrovert' | awk '{print $1}')
          test -n "$win" || { echo "No NoIntrovert window found"; xwininfo -root -tree; exit 1; }
          xprop -id "$win" _NET_WM_ICON | head -c 120; echo
          xprop -id "$win" _NET_WM_ICON | grep -q 'CARDINAL' || { echo "The window has no _NET_WM_ICON"; exit 1; }
          xwd -root -silent | convert xwd:- smoke/linux-x64.png
          kill "$app" "$xvfb" || true
          cat smoke/app.log

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.tar.gz
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-screenshot
          path: smoke/linux-x64.png
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cat > notes.md <<EOF
          NoIntrovert $VERSION, built with lib-chd-kit and lib-wii-gamecube-kit (Dolphin's GameCube/Wii disc code: discs to RVZ, and RVZ/WIA/GCZ back to ISO).

          NoIntrovert is free software under the GNU GPL, version 3 (LICENSE in every download). Its complete source, including the native libraries, is this repository at tag $GITHUB_REF_NAME: https://github.com/$GITHUB_REPOSITORY/tree/$GITHUB_REF_NAME

          | Download | For |
          |---|---|
          | NoIntrovert-$VERSION-win-x64.zip | Windows 10/11 on Intel or AMD (64-bit) |
          | NoIntrovert-$VERSION-win-arm64.zip | Windows 11 on ARM (Snapdragon and similar) |
          | NoIntrovert-$VERSION-osx-arm64.zip | macOS 12 or later on Apple silicon (M1 and newer) |
          | NoIntrovert-$VERSION-osx-x64.zip | macOS 12 or later on Intel Macs |
          | NoIntrovert-$VERSION-linux-x64.tar.gz | Linux on Intel or AMD (64-bit), glibc 2.35 or later (Ubuntu 22.04, Debian 12, Fedora 36 and newer) |

          Windows: unzip and run NoIntrovert.exe. SmartScreen may warn that the app is unrecognised; choose More info → Run anyway.

          macOS: unzip and move NoIntrovert.app to Applications. The app isn't notarised, so the first time, right-click it and choose Open (or run \`xattr -dr com.apple.quarantine /Applications/NoIntrovert.app\`).

          Linux: extract the tar.gz and run NoIntrovert from the folder it makes (\`tar -xzf NoIntrovert-$VERSION-linux-x64.tar.gz && ./NoIntrovert-$VERSION-linux-x64/NoIntrovert\`). Keep the .so files next to it. It needs X11 or XWayland and the usual desktop libraries (ICU, fontconfig, libICE, libSM).
          EOF
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.tar.gz --repo "$GITHUB_REPOSITORY" \
            --title "NoIntrovert $VERSION" --notes-file notes.md
